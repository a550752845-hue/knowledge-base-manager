name: 功能建议
description: 提议一个明确的知识库管理或开发体验改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述当前工作流中的具体限制和受影响用户。
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 描述用户可观察到的结果，不必先指定实现。
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: 数据与安全影响
      description: 说明是否涉及原始来源、批量写入、隐私边界、网络或认证。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该建议与知识库管理、Skill 契约或确定性 CLI 直接相关。
          required: true
