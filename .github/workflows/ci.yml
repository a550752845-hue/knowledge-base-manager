name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Release quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Validate release structure
        run: python scripts/validate_release.py

      - name: Python compile check
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/knowledge-base-manager-pycache
        run: python -c "import pathlib, py_compile; files = sorted(pathlib.Path('.').rglob('*.py')); [py_compile.compile(str(path), doraise=True) for path in files]; print(f'compiled {len(files)} files')"

  test:
    name: E2E and coverage (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.14"

    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: End-to-end smoke
        run: python scripts/smoke_e2e.py

      - name: Skill unit tests and coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/plugins/knowledge-base-manager/skills/transcript-knowledge-manager/scripts
        run: |
          python -m coverage run --source=plugins/knowledge-base-manager/skills/transcript-knowledge-manager/scripts -m unittest discover -s plugins/knowledge-base-manager/skills/transcript-knowledge-manager/tests -t plugins/knowledge-base-manager/skills/transcript-knowledge-manager -p "test_*.py" -v
          python -m coverage report --show-missing --fail-under=75
          python -m coverage xml
